<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamados SETIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Cabeçalho -->
    <header id="header-bg" class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div id="logo-container" class="bg-white text-blue-800 font-bold p-2 rounded">SETIC</div>
            <h1 id="titulo-painel" class="text-2xl font-bold">Dashboard de Suporte</h1>
        </div>
        <button id="btn-config" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded text-sm font-semibold transition">Configurações</button>
    </header>

    <!-- Modal de Configurações -->
    <div id="modal-config" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-96 text-black">
            <h2 class="text-xl font-bold mb-4">Personalizar Painel</h2>
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1">Título do Painel</label>
                <input type="text" id="input-titulo" class="w-full border rounded p-2" placeholder="Ex: Dashboard SETIC">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1">Cor Principal (Hex)</label>
                <input type="color" id="input-cor" class="w-full border rounded p-1 h-10 cursor-pointer" value="#1e40af">
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button id="btn-fechar-config" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Cancelar</button>
                <button id="btn-guardar-config" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Barra de Controlos e Upload -->
    <div class="max-w-7xl mx-auto p-4 mt-4 bg-white rounded shadow flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
            <label class="block font-semibold text-sm">Importar Planilha Quadrimestral:</label>
            <input type="file" id="file-upload" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            <div id="loader-upload" class="loader"></div>
        </div>
        <div id="status-mensagem" class="text-sm font-semibold text-green-600 hidden"></div>
    </div>

    <!-- Filtros -->
    <div class="max-w-7xl mx-auto p-4 mt-4 bg-white rounded shadow grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Filtrar por Mês</label>
            <select id="filtro-mes" class="w-full border rounded p-2"><option value="Todos">Todos os Meses</option></select>
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Filtrar por Analista</label>
            <select id="filtro-analista" class="w-full border rounded p-2"><option value="Todos">Todos os Analistas</option></select>
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Filtrar por Criticidade (Prioridade)</label>
            <select id="filtro-prioridade" class="w-full border rounded p-2"><option value="Todos">Todas as Prioridades</option></select>
        </div>
    </div>

    <!-- Indicadores (KPIs) -->
    <div class="max-w-7xl mx-auto mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white p-6 rounded shadow flex flex-col items-center justify-center">
            <h3 class="text-gray-500 text-sm font-bold uppercase">Total de Chamados</h3>
            <span id="kpi-total" class="text-4xl font-extrabold text-blue-800">0</span>
        </div>
        <div class="bg-white p-6 rounded shadow flex flex-col items-center justify-center">
            <h3 class="text-gray-500 text-sm font-bold uppercase">Taxa de Resolução (SLA Atendido)</h3>
            <span id="kpi-sla" class="text-4xl font-extrabold text-green-600">0%</span>
        </div>
    </div>

    <!-- Gráficos -->
    <div class="max-w-7xl mx-auto mt-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Evolução Mensal -->
        <div class="bg-white p-4 rounded shadow">
            <h3 class="font-bold text-center mb-2">Chamados por Mês</h3>
            <canvas id="chart-meses"></canvas>
        </div>
        <!-- Desempenho Analistas -->
        <div class="bg-white p-4 rounded shadow">
            <h3 class="font-bold text-center mb-2">Volume por Analista</h3>
            <canvas id="chart-analistas"></canvas>
        </div>
    </div>

    <div class="max-w-7xl mx-auto mt-4 grid grid-cols-1 lg:grid-cols-2 gap-4 mb-10">
        <!-- Top 15 Assuntos -->
        <div class="bg-white p-4 rounded shadow">
            <h3 class="font-bold text-center mb-2">Top 15 Assuntos Mais Solicitados</h3>
            <canvas id="chart-assuntos"></canvas>
        </div>
        <!-- Top Requerentes -->
        <div class="bg-white p-4 rounded shadow">
            <h3 class="font-bold text-center mb-2">Top 10 Maiores Requerentes</h3>
            <canvas id="chart-requerentes"></canvas>
        </div>
    </div>

    <script type="module">
        // Importações do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // Configuração gerada pelo utilizador
        const firebaseConfig = {
            apiKey: "AIzaSyBmi5IQIl0WwwrGGqq8Q-lB2gcou8TDqaU",
            authDomain: "dashboard-chamado-setic.firebaseapp.com",
            projectId: "dashboard-chamado-setic",
            storageBucket: "dashboard-chamado-setic.firebasestorage.app",
            messagingSenderId: "502847512745",
            appId: "1:502847512745:web:2941e763621ecc0af509b8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variáveis globais de estado
        let dadosGlobais = [];
        let corPrincipal = localStorage.getItem('dashCor') || '#1e40af';
        let graficos = {};

        // Iniciação e Personalização Visual
        function aplicarPersonalizacao() {
            const titulo = localStorage.getItem('dashTitulo') || 'Dashboard de Suporte';
            document.getElementById('titulo-painel').innerText = titulo;
            document.getElementById('input-titulo').value = titulo;
            document.getElementById('input-cor').value = corPrincipal;
            document.getElementById('header-bg').style.backgroundColor = corPrincipal;
        }

        document.getElementById('btn-config').addEventListener('click', () => document.getElementById('modal-config').classList.remove('hidden'));
        document.getElementById('btn-fechar-config').addEventListener('click', () => document.getElementById('modal-config').classList.add('hidden'));
        document.getElementById('btn-guardar-config').addEventListener('click', () => {
            const novoTitulo = document.getElementById('input-titulo').value;
            corPrincipal = document.getElementById('input-cor').value;
            localStorage.setItem('dashTitulo', novoTitulo);
            localStorage.setItem('dashCor', corPrincipal);
            aplicarPersonalizacao();
            atualizarDashboard(); // Recarrega os gráficos com a nova cor
            document.getElementById('modal-config').classList.add('hidden');
        });

        // Lógica de Leitura e Escrita na Nuvem
        async function carregarDadosNuvem() {
            try {
                mostrarMensagem("A carregar dados da nuvem...", false);
                const querySnapshot = await getDocs(collection(db, "chamados"));
                dadosGlobais = [];
                querySnapshot.forEach((doc) => {
                    dadosGlobais.push(doc.data());
                });
                
                if(dadosGlobais.length > 0) {
                    preencherFiltros();
                    atualizarDashboard();
                    mostrarMensagem(`Sucesso: ${dadosGlobais.length} registos carregados.`, false);
                    setTimeout(() => document.getElementById('status-mensagem').classList.add('hidden'), 3000);
                } else {
                    mostrarMensagem("Banco de dados vazio. Importe uma planilha.", false);
                }
            } catch (erro) {
                console.error("Erro ao carregar dados:", erro);
                mostrarMensagem("Erro ao conectar à nuvem.", true);
            }
        }

        async function processarEGravarPlanilha(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loader-upload').style.display = 'block';
            mostrarMensagem("A ler e gravar ficheiro na nuvem. Pode demorar uns segundos...", false);

            const reader = new FileReader();
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                // Agrupamento para não exceder o limite de 500 gravações simultâneas do Firebase
                try {
                    const batchArray = [writeBatch(db)];
                    let operationCounter = 0;
                    let batchIndex = 0;

                    jsonRows.forEach(row => {
                        if(row.Ticket) {
                            const docRef = doc(db, "chamados", String(row.Ticket));
                            batchArray[batchIndex].set(docRef, row);
                            operationCounter++;
                            if (operationCounter === 490) { 
                                batchArray.push(writeBatch(db));
                                batchIndex++;
                                operationCounter = 0;
                            }
                        }
                    });

                    for (const batch of batchArray) {
                        await batch.commit();
                    }
                    
                    document.getElementById('loader-upload').style.display = 'none';
                    await carregarDadosNuvem(); // Recarrega com os novos dados adicionados
                } catch (error) {
                    console.error("Erro ao gravar:", error);
                    mostrarMensagem("Erro ao gravar na nuvem.", true);
                    document.getElementById('loader-upload').style.display = 'none';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        document.getElementById('file-upload').addEventListener('change', processarEGravarPlanilha);

        function mostrarMensagem(texto, isError) {
            const msg = document.getElementById('status-mensagem');
            msg.innerText = texto;
            msg.className = `text-sm font-semibold ${isError ? 'text-red-600' : 'text-green-600'} block`;
        }

        // Extração de Mês a partir da string "Data Abertura"
        function obterMesAno(dataStr) {
            if (!dataStr) return "Desconhecido";
            // Lida com datas no formato "2026-03-03 15:15:29"
            if (typeof dataStr === 'string' && dataStr.includes('-')) {
                const partes = dataStr.split(' ')[0].split('-');
                if(partes.length >= 2) return `${partes[1]}/${partes[0]}`;
            }
            return "Desconhecido";
        }

        // Preenchimento de Dropdowns de Filtro
        function preencherFiltros() {
            const meses = new Set();
            const analistas = new Set();
            const prioridades = new Set();

            dadosGlobais.forEach(d => {
                meses.add(obterMesAno(d['Data Abertura']));
                if(d['Analista']) analistas.add(d['Analista']);
                if(d['Prioridade']) prioridades.add(d['Prioridade']);
            });

            preencherSelect('filtro-mes', meses, "Todos os Meses");
            preencherSelect('filtro-analista', analistas, "Todos os Analistas");
            preencherSelect('filtro-prioridade', prioridades, "Todas as Prioridades");
        }

        function preencherSelect(id, itensSet, textoDefault) {
            const select = document.getElementById(id);
            const atual = select.value;
            select.innerHTML = `<option value="Todos">${textoDefault}</option>`;
            Array.from(itensSet).sort().forEach(item => {
                if (item && item !== "Desconhecido") {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.innerText = item;
                    select.appendChild(opt);
                }
            });
            if (Array.from(itensSet).includes(atual)) select.value = atual;
        }

        ['filtro-mes', 'filtro-analista', 'filtro-prioridade'].forEach(id => {
            document.getElementById(id).addEventListener('change', atualizarDashboard);
        });

        // Lógica de Renderização dos Gráficos e Filtros
        function atualizarDashboard() {
            if (dadosGlobais.length === 0) return;

            const fMes = document.getElementById('filtro-mes').value;
            const fAnalista = document.getElementById('filtro-analista').value;
            const fPrio = document.getElementById('filtro-prioridade').value;

            const filtrados = dadosGlobais.filter(d => {
                const mesMatch = fMes === "Todos" || obterMesAno(d['Data Abertura']) === fMes;
                const analistaMatch = fAnalista === "Todos" || d['Analista'] === fAnalista;
                const prioMatch = fPrio === "Todos" || d['Prioridade'] === fPrio;
                return mesMatch && analistaMatch && prioMatch;
            });

            document.getElementById('kpi-total').innerText = filtrados.length;
            
            const atendidos = filtrados.filter(d => d['SLA Atendido'] === 'Sim').length;
            const slaPercent = filtrados.length > 0 ? ((atendidos / filtrados.length) * 100).toFixed(1) : 0;
            document.getElementById('kpi-sla').innerText = `${slaPercent}%`;

            renderizarGrafico('chart-meses', 'bar', agruparPor(filtrados, d => obterMesAno(d['Data Abertura'])));
            renderizarGrafico('chart-analistas', 'bar', agruparPor(filtrados, 'Analista'));
            
            const assuntosData = agruparPor(filtrados, 'Assunto', 15);
            renderizarGrafico('chart-assuntos', 'bar', assuntosData, true);

            const requerentesData = agruparPor(filtrados, 'Requerente', 10);
            renderizarGrafico('chart-requerentes', 'bar', requerentesData, true);
        }

        function agruparPor(dados, chaveOuFuncao, limite = null) {
            const contagem = {};
            dados.forEach(d => {
                const chave = typeof chaveOuFuncao === 'function' ? chaveOuFuncao(d) : d[chaveOuFuncao];
                if (chave) contagem[chave] = (contagem[chave] || 0) + 1;
            });
            let array = Object.keys(contagem).map(k => ({ label: k, value: contagem[k] }));
            array.sort((a, b) => b.value - a.value);
            if (limite) array = array.slice(0, limite);
            return {
                labels: array.map(i => i.label),
                values: array.map(i => i.value)
            };
        }

        function renderizarGrafico(canvasId, tipo, dadosAgrupados, horizontal = false) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (graficos[canvasId]) graficos[canvasId].destroy();

            graficos[canvasId] = new Chart(ctx, {
                type: tipo,
                data: {
                    labels: dadosAgrupados.labels,
                    datasets: [{
                        label: 'Qtd Chamados',
                        data: dadosAgrupados.values,
                        backgroundColor: corPrincipal,
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: horizontal ? 'y' : 'x',
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { beginAtZero: true }
                    }
                }
            });
        }

        // Inicialização
        aplicarPersonalizacao();
        carregarDadosNuvem();
    </script>
</body>
</html>
